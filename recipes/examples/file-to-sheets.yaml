# Put every non-empty line of a text file into its own sheet row.
# Assumes servers "fs" (@modelcontextprotocol/server-filesystem) and "sheets".
recipe: file-to-sheets
description: One sheet row per non-empty line of a text file
params: { path: string, sheet: string }
steps:
  - id: file
    call: fs__read_text_file
    args: { path: "{{ path }}" }
  - id: lines
    jq: '$file | split("\n") | map(select(. != "") | [.])'
  - id: append
    call: sheets__append_rows
    args: { sheet: "{{ sheet }}", values: "{{ lines }}" }
