# Copy a design's JSX from Paper into a source file without the AI regenerating it.
# Assumes servers "paper" (get_jsx) and "fs" (write_file).
recipe: paper-to-file
description: Write a Paper node's JSX to a file, converting class= to className=
params: { node_id: string, path: string }
steps:
  - id: jsx
    call: paper__get_jsx
    args: { nodeId: "{{ node_id }}" }
  - id: code
    jq: '$jsx | if type == "object" then (.jsx // .code // tostring) else . end | gsub("class="; "className=")'
  - id: write
    call: fs__write_file
    args: { path: "{{ path }}", content: "{{ code }}" }
