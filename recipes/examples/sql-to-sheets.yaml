# Run a query and append the rows (with a header row) to a spreadsheet — no rows pass through the AI.
# Assumes servers "db" (query tool) and "sheets" (append_rows tool).
recipe: sql-to-sheets
description: Query a database and append the result, with a header row, to a sheet
params: { sql: string, sheet: string }
steps:
  - id: rows
    call: db__query
    args: { sql: "{{ sql }}" }
  - id: table
    jq: '($rows[0] | keys_unsorted) as $k | [$k] + ($rows | map([.[$k[]]]))'
  - id: append
    call: sheets__append_rows
    args: { sheet: "{{ sheet }}", values: "{{ table }}" }
